{{define "base"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Message Board</title>
        <link href="/static/main.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
        <nav class="navbar">
            <a href="/" class="navbar-brand">Message Board</a>
            <ul class="navbar-links">
                <li><a href="/">Home</a></li>
                <li><a href="/edit">Edit</a></li>
                <li><a href="/admin">Admin</a></li>
                {{ if .Username }}
                <li class="navbar-user">{{ .Username }}</li>
                <li><form method="POST" action="/logout"><button type="submit" class="btn-link">Logout</button></form></li>
                {{ else }}
                <li><a href="/login">Login</a></li>
                {{ end }}
            </ul>
        </nav>
        <main>
            {{ if .Flash }}
            <div class="flash">{{ .Flash }}</div>
            {{ end }}
            {{ block "content" .Data }}{{ end }}
        </main>
        {{ block "footer" . }}{{ end }}
    </body>
</html>
{{end}}
