{{ define "content" }} {{- /*gotype: encore.app/frontend.Message*/ -}}
<div class="container">
    <header class="page-header">
        <h1>Admin</h1>
        <p class="subtitle">Application administration</p>
    </header>

    <div class="card">
        <h2>Current Message</h2>
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Message Text</span>
                <span class="stat-value">{{ if .Text }}{{ .Text }}{{ else }}<em>No message set</em>{{ end }}</span>
            </div>
            <div class="stat">
                <span class="stat-label">Last Modified</span>
                <span class="stat-value">{{ .ModifiedAt.Format "2006-01-02 15:04:05" }}</span>
            </div>
        </div>
    </div>
</div>
{{ end }}
