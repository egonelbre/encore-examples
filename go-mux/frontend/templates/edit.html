{{ define "content" }} {{- /*gotype: encore.app/frontend.Message*/ -}}
<div class="container">
    <header class="page-header">
        <h1>Edit Message</h1>
        <p class="subtitle">Update the message displayed on the home page</p>
    </header>

    <div class="card">
        <form method="POST" action="/edit">
            <label for="text">Message</label>
            <textarea
                name="text"
                id="text"
                rows="4"
                required
                placeholder="Type your message here..."
            >{{ .Text }}</textarea>

            {{ if .Text }}
            <p class="meta">
                Current message was last modified {{ .ModifiedAt.Format "Jan 2, 2006 at 3:04 PM" }}
            </p>
            {{ end }}

            <div class="form-actions">
                <a href="/" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Message</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
